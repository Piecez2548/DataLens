name: DataLens checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Generate production dependency SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-reproducible --validate --output-file datalens-frontend-npm-sbom.cdx.json
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datalens-frontend-npm-sbom
          path: frontend/datalens-frontend-npm-sbom.cdx.json
          retention-days: 90
      - run: npm run lint
      - run: npm run build
      - run: pip install -r ../backend/requirements-lock.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements-lock.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
